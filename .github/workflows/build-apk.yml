name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Organize and Rename Split APKs
        run: |
          mkdir -p release-apks
          for f in app/build/outputs/apk/debug/*.apk; do
            filename=$(basename "$f")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$f" "release-apks/CaddyProxy-Android-arm64-v8a.apk"
              cp "$f" "release-apks/app-debug.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$f" "release-apks/CaddyProxy-Android-armeabi-v7a.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$f" "release-apks/CaddyProxy-Android-Universal.apk"
            fi
          done
          echo "=== Generated APKs ==="
          ls -lh release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaddyProxy-Split-APKs
          path: release-apks/*.apk
          retention-days: 7

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "Caddy Proxy APK Latest Release"
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
