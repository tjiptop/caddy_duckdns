name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with Android NDK CGO
        run: |
          set -e
          # Locate NDK directory
          NDK_DIR=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_DIR" ] && [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_DIR="$ANDROID_NDK_ROOT"
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "Installing Android NDK..."
            ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "Using Android NDK: $NDK_DIR"

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          CLANG_ARM64=$(ls "$TOOLCHAIN"/aarch64-linux-android*24-clang 2>/dev/null || ls "$TOOLCHAIN"/aarch64-linux-android*-clang | head -n 1)
          CLANG_ARM32=$(ls "$TOOLCHAIN"/armv7a-linux-androideabi*24-clang 2>/dev/null || ls "$TOOLCHAIN"/armv7a-linux-androideabi*-clang | head -n 1)
          echo "Selected arm64 clang: $CLANG_ARM64"
          echo "Selected arm32 clang: $CLANG_ARM32"

          echo "=== Compiling Caddy with CGO for arm64-v8a ==="
          CC="$CLANG_ARM64" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          xcaddy build \
            --with github.com/caddy-dns/duckdns \
            --output app/src/main/jniLibs/arm64-v8a/libcaddy.so

          echo "=== Compiling Caddy with CGO for armeabi-v7a ==="
          CC="$CLANG_ARM32" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm \
          xcaddy build \
            --with github.com/caddy-dns/duckdns \
            --output app/src/main/jniLibs/armeabi-v7a/libcaddy.so

          echo "=== Built binary verification ==="
          ls -lh app/src/main/jniLibs/arm64-v8a/libcaddy.so
          ls -lh app/src/main/jniLibs/armeabi-v7a/libcaddy.so
          file app/src/main/jniLibs/arm64-v8a/libcaddy.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Organize and Rename Split APKs
        run: |
          mkdir -p release-apks
          for f in app/build/outputs/apk/debug/*.apk; do
            filename=$(basename "$f")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$f" "release-apks/CaddyProxy-Android-arm64-v8a.apk"
              cp "$f" "release-apks/app-debug.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$f" "release-apks/CaddyProxy-Android-armeabi-v7a.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$f" "release-apks/CaddyProxy-Android-Universal.apk"
            fi
          done
          echo "=== Generated APKs ==="
          ls -lh release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaddyProxy-Split-APKs
          path: release-apks/*.apk
          retention-days: 7

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "Caddy Proxy APK Latest Release"
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
